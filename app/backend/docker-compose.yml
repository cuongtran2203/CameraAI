services:
  # =====================================================
  # PostgreSQL Database
  # =====================================================
  postgres:
    image: postgres:15-alpine
    container_name: camera_analyst_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: camera_analyst
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d camera_analyst"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =====================================================
  # Redis Cache
  # =====================================================
  redis:
    image: redis:7-alpine
    container_name: camera_analyst_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =====================================================
  # Zookeeper (for Kafka)
  # =====================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: camera_analyst_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================
  # Kafka Broker
  # =====================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: camera_analyst_kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat /dev/null < /dev/tcp/localhost/9092' && echo OK"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =====================================================
  # Kafka UI (Web Interface)
  # =====================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: camera_analyst_kafka_ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: camera-analyst
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  # =====================================================
  # Main FastAPI Backend
  # =====================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: camera_analyst_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file:
      - path: ../.env.example
        required: false
      - path: ../.env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/app"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/camera_analyst"
      DATABASE_URL_SYNC: "postgresql://postgres:postgres@postgres:5432/camera_analyst"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      REDIS_URL: "redis://redis:6379"
      AI_SERVICE_URL: "http://ai_service:8000"
      SECRET_KEY: "change-this-secret-key-in-production"

  # =====================================================
  # AI Processing Service (Computer Vision & Retrieval)
  # =====================================================
  ai_service:
    build:
      context: ./app/ai_service
      dockerfile: Dockerfile
    container_name: camera_analyst_ai
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - path: ../.env.example
        required: false
      - path: ../.env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "/app"
      IMAGE_BASE_PATH: "/app"
    volumes:
      - ./app/ai_service/data:/app/ai_service/data:ro
      - ./app/ai_service/images:/app/images:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # =====================================================
  # DeepStream Human Detection Service
  # =====================================================
  deepstream:
    build:
      context: ./deepstream
      dockerfile: Dockerfile
    container_name: camera_analyst_deepstream
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./deepstream:/workspace
    command: >
      python3 -u /workspace/app.py
      --input file:///workspace/videos/test.mp4
      --kafka-bootstrap kafka:9092
      --kafka-topic ai.customer.detections
      --kafka-interval-ms 1000

  # =====================================================
  # Frontend (Vue 3 + Vite + Nginx)
  # =====================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api
        VITE_WS_URL: ws://localhost:8080
        VITE_AI_SERVICE_URL: http://localhost:8000
    container_name: camera_analyst_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    volumes:
      - ./mediamtx/hls:/var/run/mediamtx/hls:ro

  # =====================================================
  # MediaMTX - RTSP to WebRTC Proxy (for Chrome)
  # =====================================================
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: camera_analyst_mediamtx
    restart: unless-stopped
    ports:
      - "8889:8889"    # WebRTC (for browser)
      - "8888:8888"    # HLS (fallback)
      - "1935:1935"    # RTMP
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./mediamtx/hls:/hls
    networks:
      - default

networks:
  default:
    name: camera_analyst_network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
